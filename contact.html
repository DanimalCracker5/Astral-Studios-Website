<!DOCTYPE html>

<link rel="stylesheet" href="assets/shared.css"/>
<style>
.form-wrap{
  max-width:800px;margin:0 auto;padding:0 20px 80px;
}
.contact-hero-sub{
  max-width:640px;
  margin:0 auto;
  line-height:1.7;
}
.voice-agent-embed{
  width:100%;
  border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--s1);
  padding:24px;
}
.voice-agent-embed elevenlabs-convai{
  display:block;
  min-height:520px;
}
.voice-agent-fallback{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.voice-agent-fallback a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:44px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(34,211,238,.28);
  background:rgba(34,211,238,.055);
  color:var(--blue);
  font-family:'DM Mono',monospace;
  font-size:.62rem;
  letter-spacing:.08em;
  text-decoration:none;
}
.voice-agent-fallback .voice-agent-call{
  background:var(--blue);
  border-color:rgba(34,211,238,.7);
  color:#000;
}
@media(max-width:680px){
  .voice-agent-embed{padding:16px}
  .voice-agent-embed elevenlabs-convai{min-height:460px}
}

<script src="assets/nav.js"></script>

  </div>

  <div class="form-wrap">
    <div class="block">
      <div class="sec-lbl">Start a Conversation</div>
      <div class="voice-agent-embed">
        <elevenlabs-convai

          start-call-text="Start conversation"
          end-call-text="End conversation"

          <a class="voice-agent-call" href="tel:+18884124692">CALL US: (888) 412-4692</a>

</div>
