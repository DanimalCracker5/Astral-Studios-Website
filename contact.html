<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact - Astral Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/shared.css"/>
<style>
body[data-page="contact"]{
  display:flex;
  flex-direction:column;
}
body[data-page="contact"] .page-content{
  flex:1;
}
.form-wrap{
  max-width:860px;margin:0 auto;padding:0 20px 80px;
}
.contact-hero-sub{
  max-width:640px;
  margin:0 auto;
  line-height:1.7;
}
.voice-agent-embed{
  width:100%;
  max-width:760px;
  margin:0 auto;
  border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--s1);
  padding:24px;
}
.voice-agent-embed elevenlabs-convai{
  display:block;
  position:relative !important;
  inset:auto !important;
  width:100% !important;
  max-width:100% !important;
  min-height:520px;
}
.voice-agent-fallback{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.voice-agent-fallback a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:44px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(34,211,238,.28);
  background:rgba(34,211,238,.055);
  color:var(--blue);
  font-family:'DM Mono',monospace;
  font-size:.62rem;
  letter-spacing:.08em;
  text-decoration:none;
}
.voice-agent-fallback .voice-agent-call{
  background:var(--blue);
  border-color:rgba(34,211,238,.7);
  color:#000;
}
@media (max-width:900px), (hover:none) and (pointer:coarse){
  .form-wrap{
    max-width:620px;
    padding:0 18px 72px;
  }
  .voice-agent-embed{
    max-width:460px;
    padding:24px;
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 42%,rgba(255,255,255,.026)),
      var(--panel, var(--s1));
    border:1px solid var(--hairline, var(--line));
    box-shadow:0 18px 48px rgba(0,0,0,.22);
  }
  .voice-agent-embed elevenlabs-convai{
    display:none !important;
  }
  .voice-agent-fallback{
    margin-top:0;
    gap:12px;
  }
  .voice-agent-fallback a{
    width:min(100%,320px);
    min-height:50px;
    font-size:.64rem;
  }
}
@media(max-width:680px){
  .form-wrap{padding:0 14px 64px}
  .voice-agent-embed{
    max-width:420px;
    padding:20px;
  }
  .voice-agent-embed elevenlabs-convai{
    display:none !important;
  }
  .voice-agent-fallback{
    margin-top:0;
  }
  .voice-agent-fallback a{
    width:100%;
  }
}
</style>
</head>
<body data-page="contact">

<script src="assets/nav.js"></script>

<div class="page-content">

  <div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-badge"><span class="hero-badge-dot"></span>Get In Touch</div>
    <h1 class="page-title">CONTACT</h1>
    <div class="hero-rule"></div>
    <p class="hero-sub contact-hero-sub">Questions, project inquiries, bug reports, or just to say hi - talk with the Astral Studios agent below.</p>
  </div>

  <div class="form-wrap">
    <div class="block">
      <div class="sec-lbl">Start a Conversation</div>
      <div class="voice-agent-embed">
        <elevenlabs-convai
          agent-id="agent_6101kw5y8gahfh9v6405s0swkm1e"
          variant="expanded"
          action-text="Talk to Astral Studios"
          start-call-text="Start conversation"
          end-call-text="End conversation"
          expand-text="Open assistant"
        ></elevenlabs-convai>
        <div class="voice-agent-fallback">
          <a class="voice-agent-call" href="tel:+18884124692">CALL US: (888) 412-4692</a>
          <a href="https://elevenlabs.io/app/talk-to?agent_id=agent_6101kw5y8gahfh9v6405s0swkm1e&amp;branch_id=agtbrch_4201kw5y8htkfkptdfa5zs540hmg" target="_blank" rel="noopener">GO TO CHAT AGENT</a>
        </div>
      </div>
    </div>
  </div>

</div>

<footer>
  <span class="foot-l">(c) Astral Studios</span>
  <div class="foot-links">
    <a class="foot-call" href="tel:+18884124692">Call Us: (888) 412-4692</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="report-bug.html">Report a Bug</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script>
if (window.matchMedia('(max-width: 900px), (hover: none) and (pointer: coarse)').matches) {
  document.querySelector('elevenlabs-convai')?.remove();
}
</script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
</body>
</html>
