<style>
.dd-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 60px 24px 80px;
}
.dd-logo {
  width: 160px;
  height: 160px;
  border-radius: 32px;

.dd-soon {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'DM Mono', monospace;

  text-transform: uppercase;

  border: 1px solid rgba(168,85,247,.35);

.dd-soon::before {

  width: 6px;
